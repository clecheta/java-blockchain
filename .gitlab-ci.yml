image: maven:3.8.4-openjdk-17

stages:
  - blockchain
  - test
  - package

include:
  - template: Code-Quality.gitlab-ci.yml

before_script:
  - echo "before script"
  - echo $CI_COMMIT_BRANCH

Block:
  stage: blockchain
  script:
    - mvn -Dtest=com.R07r35cInc.blockchain.BlockTest
    - mvn -Dtest=com.R07r35cInc.blockchain.BlockChainTest

code_quality:
  stage: test
  artifacts:
    paths: [gl-code-quality-report.json]

package-repository:
  before_script:
  stage: package
  script:
    - 'mvn deploy -s ci_settings.xml'