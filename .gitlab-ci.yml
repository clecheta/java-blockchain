image: maven:3.8.4-openjdk-17

stages:
  - blockchain
  - cryptocurrency
  - test
  - package

include:
  - template: Code-Quality.gitlab-ci.yml

before_script:
  - echo "before script"
  - echo $CI_COMMIT_BRANCH

code_quality:
  stage: test
  artifacts:
    paths: [gl-code-quality-report.json]

Block:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.BlockTest

BlockChain:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.BlockChainTest

Nonce:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.NonceTest

NetChain:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.NetChainTest    

ReplaceChain:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.ReplaceChainTest

Cryptocurrency:
  stage: cryptocurrency
  script:
    - mvn test -Dtest=com.R07r35cInc.cryptocurrency.**

Util:
  stage: cryptocurrency
  script:
    - mvn test -Dtest=com.R07r35cInc.util.**

Use-Cases:
  stage: cryptocurrency
  script:
    - mvn test -Dtest=com.R07r35cInc.util.CryptocurrencyUseCase,com.R07r35cInc.util.LoginUseCase

Repository:
  before_script:
  stage: package
  script:
    - 'mvn deploy -s ci_settings.xml'