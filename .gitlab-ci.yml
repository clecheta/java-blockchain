image: maven:3.9.11-eclipse-temurin-25

stages:
  - blockchain
  - cryptocurrency
  - package

# CodeClimate-based Code-Quality.gitlab-ci.yml is deprecated and broken:
# codeclimate/* engine images were removed from Docker Hub (GitLab support #31261247595932).

before_script:
  - echo "before script"
  - echo $CI_COMMIT_BRANCH

Block:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.BlockTest

BlockChain:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.BlockChainTest

Nonce:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.NonceTest

NetChain:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.NetChainTest    

ReplaceChain:
  stage: blockchain
  script:
    - mvn test -Dtest=com.R07r35cInc.blockchain.ReplaceChainTest

Cryptocurrency:
  stage: cryptocurrency
  script:
    - mvn test -Dtest=com.R07r35cInc.cryptocurrency.**

Util:
  stage: cryptocurrency
  script:
    - mvn test -Dtest=com.R07r35cInc.util.**

Use-Cases:
  stage: cryptocurrency
  script:
    - mvn test -Dtest=com.R07r35cInc.CryptocurrencyUseCase,com.R07r35cInc.util.LoginUseCase

Repository:
  before_script:
  stage: package
  script:
    - 'mvn deploy -s ci_settings.xml'